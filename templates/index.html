<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  {% if demo_accounts %}<meta name="emp-demo" content="{{ demo_accounts|tojson|forceescape }}">{% endif %}
  <title>Examination Management Portal</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  

  <!-- Bootstrap 5.3.3 + Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --accent-glow: rgba(37, 99, 235, 0.15);
      --ink: #0f172a;
      --muted: #64748b;
      --subtle: #94a3b8;
      --line: #e2e8f0;
      --line-hover: #cbd5e1;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --rail: 260px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.03);
    }

    .role-admin {
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --accent-glow: rgba(79, 70, 229, 0.16);
    }
    .role-examiner {
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --accent-soft: #f0fdfa;
      --accent-glow: rgba(13, 148, 136, 0.16);
    }
    .role-student {
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: #eff6ff;
      --accent-glow: rgba(37, 99, 235, 0.16);
    }

    * { box-sizing: border-box; }
    body {
      background: var(--bg-page);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* Buttons */
    .btn {
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease-in-out;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      justify-content: center;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      --bs-btn-bg: var(--accent);
      --bs-btn-border-color: var(--accent);
      --bs-btn-hover-bg: var(--accent-hover);
      --bs-btn-hover-border-color: var(--accent-hover);
      box-shadow: 0 1px 2px 0 var(--accent-glow);
    }
    .btn-outline-primary {
      --bs-btn-color: var(--accent);
      --bs-btn-border-color: var(--accent);
      --bs-btn-hover-bg: var(--accent);
      --bs-btn-hover-border-color: var(--accent);
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    /* Form controls */
    .form-control, .form-select {
      border-radius: var(--radius-sm);
      border-color: var(--line);
      font-size: 0.925rem;
      padding: 0.55rem 0.85rem;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* App Shell - Sidebar */
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--rail);
      background: #ffffff;
      border-right: 1px solid var(--line);
      z-index: 1040;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1.25rem 1.4rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--ink);
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
    }
    .brand .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.15rem;
      box-shadow: 0 4px 10px var(--accent-glow);
    }
    .brand-meta { line-height: 1.2; }
    .brand-title { font-weight: 700; font-size: 1.05rem; }
    .brand-sub { font-size: 0.72rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }

    .nav-section {
      padding: 1rem 0.75rem;
      flex: 1;
      overflow-y: auto;
    }
    .nav-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 0.4rem 0.85rem;
      margin-bottom: 0.25rem;
    }
    .side-link {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin: 3px 0;
      padding: 0.65rem 0.95rem;
      border-radius: var(--radius-sm);
      color: #475569;
      text-decoration: none;
      font-size: 0.925rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .side-link:hover {
      background: #f1f5f9;
      color: var(--ink);
      text-decoration: none;
    }
    .side-link.router-link-exact-active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    /* Icons: built-in glyphs (replaces the bootstrap-icons font; no extra library) */
    .bi { display: inline-block; font-style: normal; line-height: 1; vertical-align: -0.1em; }
    .bi-pencil::before { content: "✎"; }
    .bi-pencil-square::before { content: "✎"; }
    .bi-mortarboard::before { content: "🎓"; }
    .bi-mortarboard-fill::before { content: "🎓"; }
    .bi-person-badge::before { content: "🪪"; }
    .bi-award::before { content: "🏅"; }
    .bi-people::before { content: "👥"; }
    .bi-people-fill::before { content: "👥"; }
    .bi-check2::before { content: "✓"; }
    .bi-check-lg::before { content: "✓"; }
    .bi-check2-all::before { content: "✓✓"; }
    .bi-check-all::before { content: "✓✓"; }
    .bi-check2-square::before { content: "☑"; }
    .bi-check2-circle::before { content: "✔"; }
    .bi-check-circle-fill::before { content: "✔"; }
    .bi-calendar3::before { content: "📅"; }
    .bi-calendar-plus::before { content: "📅"; }
    .bi-calendar-x::before { content: "📅"; }
    .bi-calendar-check::before { content: "📅"; }
    .bi-calendar-event::before { content: "📅"; }
    .bi-calendar3-range::before { content: "📅"; }
    .bi-calendar3-event::before { content: "📅"; }
    .bi-calendar-range::before { content: "📅"; }
    .bi-x-circle::before { content: "✖"; }
    .bi-x-lg::before { content: "✕"; }
    .bi-ticket-detailed::before { content: "🎫"; }
    .bi-ticket::before { content: "🎫"; }
    .bi-speedometer2::before { content: "◔"; }
    .bi-plus-lg::before { content: "＋"; }
    .bi-journal-x::before { content: "📓"; }
    .bi-journal-text::before { content: "📓"; }
    .bi-journal-check::before { content: "📓"; }
    .bi-journal-bookmark::before { content: "📓"; }
    .bi-gear::before { content: "⚙"; }
    .bi-clock::before { content: "🕒"; }
    .bi-clock-history::before { content: "🕒"; }
    .bi-card-checklist::before { content: "☰"; }
    .bi-camera-video::before { content: "🎥"; }
    .bi-trophy::before { content: "🏆"; }
    .bi-trash3::before { content: "🗑"; }
    .bi-shield-lock::before { content: "🛡"; }
    .bi-search::before { content: "🔍"; }
    .bi-person-x::before { content: "👤"; }
    .bi-person-plus::before { content: "👤"; }
    .bi-person-plus-fill::before { content: "👤"; }
    .bi-person-check::before { content: "👤"; }
    .bi-inbox::before { content: "📥"; }
    .bi-exclamation-triangle-fill::before { content: "⚠"; }
    .bi-exclamation-octagon-fill::before { content: "⚠"; }
    .bi-exclamation-circle::before { content: "⚠"; }
    .bi-envelope::before { content: "✉"; }
    .bi-book-half::before { content: "📖"; }
    .bi-book::before { content: "📖"; }
    .bi-tag::before { content: "🏷"; }
    .bi-send-check::before { content: "➤"; }
    .bi-printer::before { content: "🖶"; }
    .bi-lock::before { content: "🔒"; }
    .bi-list::before { content: "☰"; }
    .bi-lightning-charge-fill::before { content: "⚡"; }
    .bi-info-circle-fill::before { content: "ℹ"; }
    .bi-hourglass-split::before { content: "⏳"; }
    .bi-hourglass::before { content: "⏳"; }
    .bi-file-text-fill::before { content: "📄"; }
    .bi-file-earmark-text::before { content: "📄"; }
    .bi-file-earmark-spreadsheet::before { content: "📄"; }
    .bi-file-earmark-pdf::before { content: "📄"; }
    .bi-eye::before { content: "👁"; }
    .bi-eye-slash::before { content: "🙈"; }
    .bi-download::before { content: "⬇"; }
    .bi-door-closed::before { content: "🚪"; }
    .bi-cup-hot::before { content: "☕"; }
    .bi-chevron-right::before { content: "›"; }
    .bi-box-arrow-right::before { content: "⇥"; }
    .bi-box-arrow-in-right::before { content: "⇤"; }
    .bi-bookmark-check::before { content: "🔖"; }
    .bi-bell-slash::before { content: "🔕"; }
    .bi-bell::before { content: "🔔"; }
    .side-link .bi {
      font-size: 1.1rem;
      width: 1.3rem;
      text-align: center;
    }
    .sidebar-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--line);
      background: #fafbfc;
    }
    .role-badge-box {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.75rem;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }

    /* Main Area & Topbar */
    .main {
      margin-left: var(--rail);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1030;
      height: 64px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.5rem;
    }
    .topbar .page-heading {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink);
      flex: 1;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 2px 6px var(--accent-glow);
    }
    .icon-btn {
      border: 0;
      background: transparent;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      position: relative;
      display: grid;
      place-items: center;
      color: #475569;
      transition: background .15s ease, color .15s ease;
    }
    .icon-btn:hover {
      background: #f1f5f9;
      color: var(--ink);
    }
    .icon-btn .badge-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 0 2px #ffffff;
    }
    .content {
      padding: 1.75rem 2rem;
      max-width: 1360px;
      width: 100%;
      flex: 1;
    }
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      z-index: 1035;
    }

    @media (max-width: 991px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .content { padding: 1.25rem 1rem; }
    }

    /* Cards & Surfaces */
    .card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .card.hover-lift:hover {
      box-shadow: var(--shadow-lg);
      border-color: var(--line-hover);
    }

    /* Stat Cards */
    .card-stat {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-md);
      background: #ffffff;
      padding: 1.25rem;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .card-stat:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .card-stat .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
    }
    .card-stat .stat-label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }
    .card-stat .stat-value {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.1;
    }

    /* Soft Badges */
    .badge-soft {
      font-size: 0.76rem;
      font-weight: 600;
      border-radius: var(--radius-pill);
      padding: 0.35em 0.8em;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      letter-spacing: 0.02em;
    }
    .badge-soft-success { background: #dcfce7; color: #15803d; }
    .badge-soft-primary { background: #dbeafe; color: #1d4ed8; }
    .badge-soft-info { background: #e0f2fe; color: #0369a1; }
    .badge-soft-warning { background: #fef3c7; color: #b45309; }
    .badge-soft-danger { background: #fee2e2; color: #b91c1c; }
    .badge-soft-secondary { background: #f1f5f9; color: #475569; }
    .badge-soft-dark { background: #e2e8f0; color: #1e293b; }

    /* Tables */
    .table {
      --bs-table-bg: transparent;
      font-size: 0.915rem;
    }
    .table > :not(caption) > * > * {
      padding: 0.85rem 1.15rem;
      border-bottom-color: var(--line);
    }
    .table thead th {
      font-size: 0.725rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      color: var(--muted);
      background: #fafbfc;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    .table-hover > tbody > tr:hover > * {
      background-color: #f8fafc;
    }

    /* Hero Banners */
    .hero-banner {
      background: linear-gradient(135deg, var(--accent) 0%, #4338ca 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 1.75rem 2rem;
      box-shadow: 0 10px 25px -5px var(--accent-glow);
    }
    .role-examiner .hero-banner {
      background: linear-gradient(135deg, var(--accent) 0%, #065f46 100%);
    }

    /* Classroom style Exam Cards */
    .exam-card {
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--line);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .exam-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    .exam-card .head {
      color: #fff;
      padding: 1.25rem;
      min-height: 105px;
      position: relative;
    }
    .exam-card .head .t {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .exam-card .head .s {
      font-size: 0.85rem;
      opacity: 0.92;
      margin-top: 0.25rem;
    }
    .exam-card .head .chip {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(4px);
      border-radius: var(--radius-pill);
      padding: 0.2rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .exam-card .body {
      padding: 1.25rem;
      background: #ffffff;
    }

    /* To Do and Agenda List */
    .todo-item {
      display: flex;
      gap: 1rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .todo-item:last-child { border-bottom: 0; }
    .todo-date {
      min-width: 54px;
      text-align: center;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.35rem 0;
      line-height: 1.15;
    }
    .todo-date b { display: block; font-size: 1.35rem; font-weight: 700; }
    .todo-date small { font-size: 0.75rem; text-transform: uppercase; font-weight: 600; }

    /* Modals & Backdrops */
    .modal-backdrop-custom {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1050;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-y: auto;
    }
    .modal-dialog { width: 100%; max-width: 540px; margin: auto; }
    .modal-dialog.modal-lg { max-width: 820px; }
    .modal-dialog.modal-sm { max-width: 420px; }
    .modal-content {
      border-radius: var(--radius-lg);
      border: 0;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      background: #ffffff;
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      align-items: center;
    }
    .modal-body { padding: 1.5rem; }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--line);
      background: #fafbfc;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }

    /* Notifications Flyout */
    .notif-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 360px;
      max-width: 90vw;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 1060;
      overflow: hidden;
    }
    .notif-header {
      padding: 0.85rem 1rem;
      background: #fafbfc;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .notif-list {
      max-height: 360px;
      overflow-y: auto;
    }
    .notif-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
      transition: background .15s ease;
    }
    .notif-item:hover { background: #f8fafc; }
    .notif-item.unread {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
    }

    /* Auth Page */
    .auth-bg {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.08) 0%, rgba(248, 250, 252, 0.9) 80%),
                  radial-gradient(circle at 90% 80%, rgba(79, 70, 229, 0.08) 0%, rgba(248, 250, 252, 0.9) 80%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .auth-card-body {
      padding: 2.25rem;
    }
    .demo-role-btn {
      font-size: 0.8rem;
      padding: 0.4rem 0.65rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .demo-role-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    /* "Sign in as" choice on the login page: three equal cards, real radio inputs underneath (keyboard + screen readers) */
    .role-choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .role-option {
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      padding: 0.65rem 0.4rem; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: #f8fafc; color: #334155; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; user-select: none; transition: all 0.15s ease;
    }
    .role-option .bi { font-size: 1.3rem; }
    .role-option:hover { border-color: var(--accent); color: var(--accent); }
    .role-option.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
    .role-option:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Toast Container */
    .toast-box {
      position: fixed;
      top: 80px;
      right: 24px;
      z-index: 2000;
      min-width: 280px;
      max-width: 420px;
    }
    .toast-pill {
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      border: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      animation: slideIn .2s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateX(40px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Empty states */
    .empty-state {
      padding: 3rem 1.5rem;
      text-align: center;
      color: var(--muted);
    }
    .empty-state .empty-icon {
      font-size: 2.5rem;
      color: var(--subtle);
      margin-bottom: 0.75rem;
    }

    /* ---- Shared design tokens: every page follows the same role accent ---- */
    .text-primary { color: var(--accent) !important; }
    .bg-primary-subtle { background-color: var(--accent-soft) !important; }
    .progress-bar { background-color: var(--accent); }
    .nav-pills { --bs-nav-pills-link-active-bg: var(--accent); }
    .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }

    /* Page header: title + subtitle + actions (identical spacing on every page) */
    .page-header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 0.75rem 1rem; margin-bottom: 1.5rem;
    }
    .page-header h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.15rem; color: var(--ink); }
    .page-header .page-sub { color: var(--muted); font-size: 0.875rem; }
    .page-header .page-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .hero-banner h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.25rem; }
    .hero-banner .hero-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .section-title { font-size: 1.05rem; font-weight: 700; margin: 0; color: var(--ink); }
    .crumbs { flex: 1; display: flex; align-items: center; gap: 0.5rem; min-width: 0; color: var(--muted); font-size: 0.95rem; }
    .crumbs strong { color: var(--ink); font-weight: 600; }
    .crumbs .bi { font-size: 0.7rem; }
    .crumbs > * { white-space: nowrap; }
    .crumbs strong { overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 575.98px) { .crumbs > span, .crumbs > .bi { display: none; } }  /* phone: show just the page title */
    /* a <select> inside a table cell is width:100% and would collapse to a few pixels; keep it readable */
    /* Chart.js charts (the ChartBox component) */
    .chart-canvas { position: relative; height: 232px; width: 100%; }
    .chart-box { width: 100%; }
    .chart-title { font-size: 0.8rem; font-weight: 600; color: #334155; text-align: center; margin-bottom: 0.5rem; }
    .chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
    .chart-grid line { stroke: #f1f5f9; stroke-width: 1; }
    .chart-grid text, .chart-label { font-size: 11px; fill: #64748b; }
    .chart-value { font-size: 11.5px; font-weight: 700; fill: #334155; }
    .chart-bar:hover path { fill-opacity: 1; }
    .chart-empty { height: 210px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.9rem; }
    .status-select { min-width: 9.5rem; }
    .table .form-select-sm { min-width: 11rem; }
    .actions-wrap { min-width: 12rem; }           /* many buttons: let them wrap onto a second line instead of widening the table */
    .actions-wrap .btn { margin-bottom: 0.25rem; }
    .badge-soft { white-space: nowrap; }   /* "10:00 - 10:20" and "Booking Open" never break across lines */
    .exam-card .head .t { padding-right: 7.5rem; }  /* the type/status chip sits top-right: keep the title clear of it */

    /* Stat tile colours (one palette for admin, examiner and student dashboards) */
    .tone-indigo { --tone: #4f46e5; --tone-bg: #eef2ff; }
    .tone-blue, .tone-primary { --tone: #2563eb; --tone-bg: #eff6ff; }
    .tone-teal { --tone: #0d9488; --tone-bg: #f0fdfa; }
    .tone-violet { --tone: #7c3aed; --tone-bg: #f5f3ff; }
    .tone-amber, .tone-warning { --tone: #d97706; --tone-bg: #fffbeb; }
    .tone-rose, .tone-danger { --tone: #e11d48; --tone-bg: #fff1f2; }
    .tone-sky, .tone-info { --tone: #0284c7; --tone-bg: #f0f9ff; }
    .tone-green, .tone-success { --tone: #16a34a; --tone-bg: #f0fdf4; }
    .card-stat .stat-icon { background: var(--tone-bg, var(--accent-soft)); color: var(--tone, var(--accent)); }

    /* Inset panels, card title bars, filter bars, seat meters */
    .panel-inset {
      background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 1rem;
    }
    .card-title-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      padding: 0.9rem 1.15rem; background: #ffffff; border-bottom: 1px solid var(--line);
      font-weight: 600; border-radius: var(--radius-md) var(--radius-md) 0 0;
    }
    .card-title-bar .bi { color: var(--accent); margin-right: 0.5rem; }
    /* .filter-bar is combined with Bootstrap's .card (a column flexbox), so the direction must be reset to a row;
       otherwise the flex-basis values below become HEIGHTS. */
    .filter-bar { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 0.75rem; padding: 1rem; margin-bottom: 1rem; }
    .filter-bar .filter-search { flex: 1 1 280px; width: auto; }
    .filter-bar .form-select { flex: 0 1 210px; width: auto; }
    .empty-state.compact { padding: 1.25rem 1rem; font-size: 0.9rem; }
    .empty-state.compact .empty-icon { font-size: 1.6rem; margin-bottom: 0.35rem; }
    .seat-meter { display: flex; align-items: center; gap: 0.6rem; min-width: 120px; }
    .seat-meter .progress { flex: 1; height: 6px; }

    /* Printable Scorecard */
    @media print {
      body * { visibility: hidden; }
      .printable, .printable * { visibility: visible; }
      .printable {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        box-shadow: none !important;
        border: 1px solid #94a3b8 !important;
      }
      .no-print { display: none !important; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
